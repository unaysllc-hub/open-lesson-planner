<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A free, local-first lesson planning worksheet for educators."><title>Open Lesson Planner</title>
  <style>
    :root{--ink:#16383d;--teal:#0b7678;--coral:#d2634c;--paper:#f4f8f6;--line:#cbdcd6;--muted:#5f7478}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{width:min(1120px,calc(100% - 28px));margin:auto;padding:30px 0 70px}header{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:38px 0}h1{margin:0;font-size:clamp(2.2rem,6vw,4.8rem);line-height:1;letter-spacing:0}.intro{max-width:520px;margin:0;color:var(--muted)}.toolbar{position:sticky;top:8px;z-index:2;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.95);box-shadow:0 8px 24px #17383d10}.toolbar button,.file-button{display:inline-flex;align-items:center;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font:800 .82rem system-ui;cursor:pointer}.toolbar .primary{border-color:var(--teal);background:var(--teal);color:#fff}.file-button input{position:absolute;opacity:0;pointer-events:none}.saved{margin-left:auto;align-self:center;color:var(--muted);font-size:.78rem}.planner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.field{padding:18px;border:1px solid var(--line);border-radius:8px;background:#fff}.field.wide{grid-column:1/-1}.field label{display:block;margin-bottom:8px;font-size:.78rem;font-weight:850;text-transform:uppercase}.field input,.field textarea,.field select{width:100%;border:1px solid #b8c9c3;border-radius:6px;background:#fff;color:var(--ink);font:inherit}.field input,.field select{height:44px;padding:0 11px}.field textarea{min-height:130px;padding:11px;resize:vertical}.field small{display:block;margin-top:7px;color:var(--muted)}.sequence{counter-reset:step}.sequence .field label:before{counter-increment:step;content:counter(step) '. ';color:var(--coral)}@media(max-width:720px){header{display:block}.intro{margin-top:14px}.planner{grid-template-columns:1fr}.field.wide{grid-column:auto}.saved{width:100%;margin-left:0}}@media print{body{background:#fff}.shell{width:100%;padding:0}header{padding:0 0 20px}.toolbar{display:none}.field{break-inside:avoid}.planner{gap:8px}}
    .file-button input{width:1px;height:1px;clip-path:inset(50%)}
  </style>
</head>
<body><main class="shell"><header><div><strong>Open educator tool</strong><h1>Lesson Planner</h1></div><p class="intro">Build a clear sequence from learning objective to assessment. Your draft stays in this browser unless you export it.</p></header><form id="planner"><div class="toolbar"><button type="button" class="primary" id="print">Print plan</button><button type="button" id="export">Export JSON</button><label class="file-button">Import JSON<input type="file" id="import" accept="application/json"></label><button type="button" id="new">New plan</button><span class="saved" id="saved" aria-live="polite">Draft ready</span></div><div class="planner"><div class="field"><label for="title">Lesson title</label><input id="title" name="title" required placeholder="Introduction to ecosystems"></div><div class="field"><label for="subject">Subject and grade</label><input id="subject" name="subject" placeholder="Science, Grade 6"></div><div class="field"><label for="duration">Duration</label><input id="duration" name="duration" placeholder="45 minutes"></div><div class="field"><label for="date">Date</label><input id="date" name="date" type="date"></div><div class="field wide"><label for="objective">Learning objective</label><textarea id="objective" name="objective" placeholder="By the end of the lesson, learners will be able to..."></textarea><small>Use a specific, observable outcome.</small></div><div class="field wide"><label for="success">Success criteria</label><textarea id="success" name="success" placeholder="Learners can show success when they..."></textarea></div></div><div class="planner sequence"><div class="field"><label for="opening">Opening and prior knowledge</label><textarea id="opening" name="opening" placeholder="Question, retrieval prompt, or short demonstration"></textarea></div><div class="field"><label for="instruction">Direct instruction or modeling</label><textarea id="instruction" name="instruction" placeholder="Key explanation, worked example, or teacher model"></textarea></div><div class="field"><label for="practice">Guided and independent practice</label><textarea id="practice" name="practice" placeholder="Learner activity, timing, grouping, and teacher role"></textarea></div><div class="field"><label for="check">Check for understanding</label><textarea id="check" name="check" placeholder="Questions or evidence used during the lesson"></textarea></div><div class="field"><label for="assessment">Assessment and exit task</label><textarea id="assessment" name="assessment" placeholder="How learning will be measured at the end"></textarea></div><div class="field"><label for="next">Next steps</label><textarea id="next" name="next" placeholder="Extension, reteaching, homework, or next lesson"></textarea></div><div class="field"><label for="materials">Materials</label><textarea id="materials" name="materials" placeholder="Resources, links, equipment, and preparation"></textarea></div><div class="field"><label for="support">Access and differentiation</label><textarea id="support" name="support" placeholder="Scaffolds, language support, challenge, and accommodations"></textarea></div></div></form></main>
<script>
 const KEY='open-lesson-planner-v1',form=document.querySelector('#planner'),saved=document.querySelector('#saved');
 const data=()=>Object.fromEntries(new FormData(form).entries());
 function load(obj){for(const [key,value] of Object.entries(obj||{})){const el=form.elements.namedItem(key);if(el)el.value=String(value)}}
 function save(){localStorage.setItem(KEY,JSON.stringify(data()));saved.textContent='Saved locally at '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
 let wait;form.addEventListener('input',()=>{clearTimeout(wait);wait=setTimeout(save,300)});load(JSON.parse(localStorage.getItem(KEY)||'{}'));
 document.querySelector('#print').onclick=()=>window.print();
 document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'open-lesson-planner',version:1,plan:data()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(data().title||'lesson-plan').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.json';a.click();URL.revokeObjectURL(a.href)};
 document.querySelector('#import').onchange=async e=>{try{const parsed=JSON.parse(await e.target.files[0].text());load(parsed.plan||parsed);save()}catch{alert('This file is not a valid lesson plan JSON file.')}e.target.value=''};
 document.querySelector('#new').onclick=()=>{if(confirm('Clear the current local draft?')){form.reset();localStorage.removeItem(KEY);saved.textContent='New blank plan'}};
</script></body></html>
